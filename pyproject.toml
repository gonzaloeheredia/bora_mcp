[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boletin-oficial-mcp"
version = "0.1.0"
description = "Servidor MCP para buscar avisos en el Boletín Oficial de la República Argentina"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = ["mcp[cli]>=1.2.0"]

[project.scripts]
boletin-oficial-mcp = "boletin_oficial_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
